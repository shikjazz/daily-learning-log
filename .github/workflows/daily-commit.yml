name: Daily Learning Log

on:
  schedule:
    # Runs every day at a random-ish time (8:42 AM UTC = ~9:42 AM CET)
    - cron: '42 8 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily commit script
        run: python daily_commit.py

      - name: Generate daily LLM project
        run: python generate_project.py

      - name: Commit and push
        run: |
          git config user.name "Shikhar Sharma"
          git config user.email "shikjazz@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          PROJECT_NAME=$(python -c "
          from datetime import datetime
          from generate_project import get_project_for_date
          p = get_project_for_date(datetime.now())
          print(p['name'])
          ")

          git commit -m "daily: learning log + ${PROJECT_NAME} project ($(date +%Y-%m-%d))"
          git push
